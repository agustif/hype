name: macOS Build and Test

on:
  push:
    branches: [ master, cursor/macos-support-cac9 ]
  pull_request:
    branches: [ master ]

jobs:
  macos-build:
    runs-on: macos-14
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        brew install qt@6 ffmpeg source-highlight webp
        echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH
        echo "HOMEBREW_PREFIX=$(brew --prefix)" >> $GITHUB_ENV
    
    - name: Verify Qt installation
      run: |
        qmake6 --version
        which macdeployqt6 || which macdeployqt || echo "macdeployqt not found"
    
    - name: Build hype
      run: |
        mkdir -p build
        cd build
        qmake6 ../hype.pro CONFIG+=release
        make -j$(sysctl -n hw.ncpu)
    
    - name: Create app bundle
      run: |
        cd build
        mkdir -p hype.app/Contents/{MacOS,Resources}
        cp ../macos/Info.plist hype.app/Contents/
        cp hype hype.app/Contents/MacOS/
        if command -v macdeployqt6 &> /dev/null; then
          macdeployqt6 hype.app -qmldir=../src
        elif command -v macdeployqt &> /dev/null; then
          macdeployqt hype.app -qmldir=../src
        fi
        codesign --force --deep --sign - hype.app || true
    
    - name: Test CLI commands
      run: |
        cd build
        ./hype.app/Contents/MacOS/hype --help
        ./hype.app/Contents/MacOS/hype --version
        ./hype.app/Contents/MacOS/hype themes || true
    
    - name: Test example rendering
      run: |
        cd build
        mkdir -p test-output
        ./hype.app/Contents/MacOS/hype render ../examples/welcome.md test-output/
        ls -la test-output/
        test -f test-output/slides.json || (echo "slides.json not created" && exit 1)
    
    - name: Test PDF export
      run: |
        cd build
        ./hype.app/Contents/MacOS/hype export ../examples/welcome.md test-output/welcome.pdf --pdf
        test -f test-output/welcome.pdf || (echo "PDF not created" && exit 1)
    
    - name: Build tests
      run: |
        mkdir -p build/tests
        cd build/tests
        qmake6 ../../tests/tests.pro
        make -j$(sysctl -n hw.ncpu)
    
    - name: Run tests
      run: |
        cd build/tests
        QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME=generic QT_STYLE_OVERRIDE=Fusion ./hype-tests || true
      continue-on-error: true
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: macos-build
        path: |
          build/hype.app
          build/test-output/

  linux-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          qt6-base-dev qt6-declarative-dev qt6-multimedia-dev \
          libgl1-mesa-dev \
          ffmpeg source-highlight libwebp-dev
    
    - name: Build hype
      run: |
        ./bin/build
    
    - name: Test CLI commands
      run: |
        ./build/hype --help
        ./build/hype --version
    
    - name: Build and run tests
      run: |
        ./bin/test
